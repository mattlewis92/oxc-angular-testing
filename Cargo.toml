[workspace]
resolver = "3"
members = ["crates/ng-transform", "crates/ng-transform-napi"]

[workspace.package]
edition = "2024"
version = "0.0.0"
license = "MIT"
repository = "https://github.com/mattlewis/oxc-angular-testing"
# oxc_coverage_instrument 0.20 requires 1.97.
rust-version = "1.97"

[workspace.dependencies]
# All oxc crates pinned to 0.157 to match oxc_coverage_instrument's manifest.
# Cargo's single lockfile unifies every oxc_* crate (ours + the coverage crate's)
# to the same resolved 0.157.x, which is what keeps the arena AST types
# compatible so the Angular transforms and the coverage visitor share one AST.
oxc_allocator = "0.157"
oxc_ast = "0.157"
oxc_ast_visit = "0.157"
oxc_codegen = "0.157"
oxc_parser = "0.157"
oxc_semantic = "0.157"
oxc_span = "0.157"
oxc_syntax = "0.157"
oxc_transformer = "0.157"
oxc_traverse = "0.157"
# Exact pin: `instrument_program` sits behind the upstream-"experimental"
# `ast-api` feature, so its signature may change in any minor release.
oxc_coverage_instrument = { version = "=0.20.0", features = ["ast-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
